<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Textbook Library · College of Charleston</title>
  <meta name="description" content="A student-run free textbook library. Free textbooks, no fees, no questions. Browse the catalog and request a book in under a minute." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Static copy of the request form so Netlify detects it at build time.
       The live form is rendered by React (src/pages/CatalogPage.jsx) and posts the same fields. -->
  <form name="book-request" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="book-request" />
    <input name="bookTitle" />
    <input name="bookIsbn" />
    <input name="bookAuthor" />
    <input name="bookEdition" />
    <input name="bookSubject" />
    <input name="course" />
    <input name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
    <input name="availabilityRating" />
  </form>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
